<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>BystandingHeadstand</title>
    <style>
        body {
            background: linear-gradient(180deg, rgb(0, 0, 0) 0%, rgb(255, 255, 255) 100%);
            background-size: cover;
            background-attachment: fixed;
        }

        p {
            color: rgb(0, 0, 0)
        }

        div {
            background: linear-gradient(90deg, rgb(155, 50, 50) 0%, rgb(255, 80, 80) 50%, rgb(255, 100, 100) 100%);
            border: 10px solid rgb(70, 20, 20);
            padding: 30px;
            height: 180px;
            border-radius: 10px
        }

        #two {
            background: linear-gradient(90deg, rgb(255, 167, 60) 0%, rgb(255, 197, 90) 50%, rgb(255, 200, 110) 100%);
            border: 10px solid rgb(150, 100, 30)
        }

        #three {
            background: linear-gradient(90deg, rgb(255, 255, 50) 0%, rgb(252, 255, 100) 50%, rgb(255, 250, 130) 100%);
            border: 10px solid rgb(170, 170, 35)
        }

        #four {
            background: linear-gradient(90deg, rgb(30, 135, 55) 0%, rgb(50, 200, 90) 50%, rgb(115, 200, 140) 100%);
            border: 10px solid rgb(30, 100, 50)
        }

        #five {
            background: linear-gradient(90deg, rgb(50, 85, 155) 0%, rgb(75, 130, 220) 50%, rgb(120, 160, 230) 100%);
            border: 10px solid rgb(33, 55, 100)
        }

        #six {
            background: rgb(128, 56, 176);
            border: 10px solid rgb(79, 25, 121)
        }
    </style>
</head>

<body>
    <div id="one">
        <p>My box</p>
        <div id="two">
            <p>His box</p>
            <div id="three">
                <p>Her box</p>
                <div id="four">
                    <p>Their box</p>
                    <div id="five">
                        <p>Their box</p>
                        <div id="six">
                            <p>Their box</p>
                        </div>
</body>

</html>
