<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>poses</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background: black;
            margin: 50px;
        }

        #static {
            background: rgb(190, 190, 190);
            position: static;
            /*default position*/
        }

        #sticky {
            background: rgb(160, 160, 160);
            position: sticky;
            /*static until it hits edge*/
        }

        #relative {
            background: rgb(130, 130, 130);
            position: relative;
            left: 100px;
            top: -100px;
            z-index: -10;
            /*moves box, leaves hole*/
        }

        #fixed {
            background: rgb(37, 37, 37);
            position: fixed;
            top: 100px;
            left: 100px;
            /*stuck with scroll*/
        }

        #absoulute {
            background: rgb(0, 0, 0);
            position: absolute;
            right: 50px;
            bottom: 50px;
            /*stuck to content, no hole*/
        }

        ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
        }

        ul li a {
            color: rgb(200, 200, 200);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div id="static"></div>
    <div id="sticky"></div>
    <div id="relative"></div>
    <div id="fixed"></div>
    <div id="absoulute"></div>
